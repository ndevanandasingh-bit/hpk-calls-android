plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hpk.calls'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hpk.calls'
        minSdk 26
        targetSdk 35
        versionCode 20100
        versionName '2.1.0'
        buildConfigField 'String', 'HPK_BASE_URL', '"https://hpk-calls.onrender.com"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
